<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>모일곳 — 우리 어디서 만날까?</title>
<meta name="description" content="출발지만 입력하면 모두에게 공평한 만날 곳과 갈 곳을 찾아줘요">
<meta property="og:type" content="website">
<meta property="og:title" content="모일곳 — 우리 어디서 만날까?">
<meta property="og:description" content="친구가 초대했어요. 출발지만 입력하면 끝!">
<meta property="og:image" content="https://moilgot.vercel.app/og.png">
<meta property="og:url" content="https://moilgot.vercel.app">
<meta property="og:image:width" content="1200"><meta property="og:image:height" content="630">
<meta name="theme-color" content="#C8F135">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --lime:#C8F135; --lime-soft:#F2FBD3; --lime-deep:#6F8F00;
  --ink:#1F2022; --muted:#707070; --faint:#A3A39C;
  --bg:#FFFFFF; --card:#F2F2EE; --line:#E6E6E0; --outer:#E9E9E3;
  --btn:#1F2022; --btn-ink:#FFFFFF;
  --map-bg:#ECEDE6; --map-road:#FFFFFF; --map-water:#CFE4EC; --map-park:#D9F0B8;
  --heart:#F04452; --live:#22C55E;
  --font:"Pretendard","Gothic A1","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ink:#F2F2EE; --muted:#A8A8A2; --faint:#6E6E68;
    --bg:#161715; --card:#242522; --line:#30312D; --outer:#0E0F0D;
    --btn:#C8F135; --btn-ink:#1F2022; --lime-soft:#2B3314; --lime-deep:#C8F135;
    --map-bg:#20211E; --map-road:#2C2D29; --map-water:#1E3440; --map-park:#27361A;
  }
}
:root[data-theme="dark"]{
  --ink:#F2F2EE; --muted:#A8A8A2; --faint:#6E6E68;
  --bg:#161715; --card:#242522; --line:#30312D; --outer:#0E0F0D;
  --btn:#C8F135; --btn-ink:#1F2022; --lime-soft:#2B3314; --lime-deep:#C8F135;
  --map-bg:#20211E; --map-road:#2C2D29; --map-water:#1E3440; --map-park:#27361A;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--outer);color:var(--ink);font-family:var(--font);-webkit-font-smoothing:antialiased;letter-spacing:-0.01em}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:3px solid var(--lime);outline-offset:2px;border-radius:8px}
#app{max-width:440px;margin:0 auto;min-height:100vh;background:var(--bg);position:relative;display:flex;flex-direction:column}
.scr{flex:1;display:flex;flex-direction:column;padding:0 24px;position:relative}
.top{display:flex;align-items:center;gap:12px;height:64px;flex:none}
.top h1{flex:1;margin:0;font-size:17px;font-weight:700}
.top .sub2{font-size:12px;color:var(--muted);font-weight:600;margin-top:2px}
.top.center h1{text-align:center}
.icon-btn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-size:22px;flex:none}
.float-btn{background:var(--bg);box-shadow:0 2px 10px rgba(0,0,0,.14)}
.progress{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-bottom:28px}
.progress i{height:5px;border-radius:3px;background:var(--line)}
.progress i.on{background:var(--lime)}
.q{font-size:26px;font-weight:800;margin:0 0 8px;letter-spacing:-0.03em;line-height:1.3}
.sub{color:var(--muted);font-size:15px;margin:0 0 28px}
.label{font-size:15px;font-weight:700;margin:24px 0 10px;display:flex;align-items:center;gap:8px}
.label small{font-weight:600;color:var(--muted);font-size:13px}
.spacer{flex:1;min-height:24px}
.cta-bar{position:sticky;bottom:0;padding:12px 0 calc(20px + env(safe-area-inset-bottom,0px));background:linear-gradient(to top,var(--bg) 75%,transparent);z-index:5}
.btn{width:100%;height:56px;border-radius:16px;background:var(--btn);color:var(--btn-ink);font-size:17px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px;transition:transform .12s}
.btn:active{transform:scale(.98)}
.btn[disabled]{opacity:.3;cursor:not-allowed}
.btn.ghost{background:var(--card);color:var(--ink)}
.btn.lime{background:var(--lime);color:#1F2022}
.btn.sm{height:48px;font-size:15px;border-radius:14px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{height:37px;padding:0 16px;border-radius:19px;background:var(--card);font-size:14px;font-weight:600;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;flex:none}
.chip.on{background:var(--lime);color:#1F2022}
.chip.sm{height:28px;padding:0 12px;font-size:12px;border-radius:14px}
.chip.xs{height:23px;padding:0 10px;font-size:11.5px;border-radius:12px;font-weight:700}
.chip.white{background:var(--bg)}
.chip.dark{background:#1F2022;color:#fff}
.av{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:14px;color:#1F2022;border:2.5px solid var(--bg);flex:none}
.card{background:var(--card);border-radius:20px;padding:16px}
.toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:14px;font-size:14px;font-weight:600;z-index:80;max-width:340px;text-align:center;animation:pop .25s}
@keyframes pop{from{opacity:0;transform:translate(-50%,8px)}}
.sw{width:44px;height:26px;border-radius:13px;background:var(--line);position:relative;flex:none;transition:background .15s}
.sw::after{content:"";position:absolute;left:3px;top:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:left .15s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.sw.on{background:#1F2022}
.sw.on::after{left:21px;background:var(--lime)}
.toggle-row{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:18px;padding:14px 16px}
.toggle-row div{flex:1;min-width:0}
.toggle-row b{display:block;font-size:15px}
.toggle-row span{font-size:12.5px;color:var(--muted)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- 00 홈 ---------- */
.logo{font-size:26px;font-weight:900;letter-spacing:-0.05em}
.dotbtn{width:40px;height:40px;border-radius:50%;background:var(--bg);box-shadow:0 2px 10px rgba(0,0,0,.12);display:grid;place-items:center;position:relative}
.dotbtn i{width:14px;height:14px;border-radius:50%;background:var(--ink)}
.dotbtn b{position:absolute;top:6px;right:6px;width:9px;height:9px;border-radius:50%;background:var(--heart);border:2px solid var(--bg)}
.hero{background:var(--lime);border-radius:28px;padding:24px 20px;position:relative;overflow:hidden;color:#1F2022;height:230px}
.hero h2{font-size:30px;font-weight:900;line-height:1.24;margin:0 0 12px;letter-spacing:-0.04em;position:relative;z-index:1}
.hero p{margin:0;font-size:14px;font-weight:600;line-height:1.5;max-width:190px;position:relative;z-index:1}
.hero svg{position:absolute;right:6px;top:10px}
.sec{font-size:17px;font-weight:800;margin:24px 0 10px;display:flex;justify-content:space-between;align-items:center}
.sec small{font-size:13px;color:var(--muted);font-weight:600}
.meet{background:var(--card);border-radius:22px;padding:16px;margin-bottom:10px;display:block;width:100%;text-align:left}
.meet h3{margin:8px 0 4px;font-size:17px;font-weight:800}
.meet .m{font-size:13px;color:var(--muted)}
.stack{display:flex}
.stack .av{width:30px;height:30px;font-size:12px;margin-right:-8px}
.past{display:flex;gap:14px;align-items:center;background:var(--card);border-radius:18px;padding:12px 14px;margin-bottom:8px;width:100%;text-align:left}
.past .sq{width:40px;height:40px;border-radius:12px;background:var(--lime);flex:none;display:grid;place-items:center;font-size:18px}
.past b{display:block;font-size:15px}
.past span{font-size:12px;color:var(--muted)}
.empty{background:var(--card);border-radius:22px;padding:20px;color:var(--muted);font-size:14px;line-height:1.55}
.tabbar{position:sticky;bottom:0;display:grid;grid-template-columns:repeat(4,1fr);background:var(--bg);border-top:1px solid var(--line);padding:10px 0 calc(12px + env(safe-area-inset-bottom,0px));margin:20px -24px 0;z-index:6}
.tabbar button{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11.5px;font-weight:700;color:var(--faint)}
.tabbar button.on{color:var(--ink)}
.tabbar svg{width:22px;height:22px}

/* ---------- 01 ---------- */
.counter{display:flex;align-items:center;justify-content:space-between;margin:40px 0 30px}
.round{width:64px;height:64px;border-radius:50%;background:var(--card);display:grid;place-items:center}
.round.dark{background:var(--btn);color:var(--btn-ink)}
.round svg{width:22px;height:22px}
.bign{text-align:center;font-size:84px;font-weight:900;line-height:1;letter-spacing:-0.05em}
.bign small{display:block;font-size:17px;font-weight:600;color:var(--muted);letter-spacing:0;margin-top:8px}
.avrow{display:flex;justify-content:center;gap:12px;margin-bottom:34px;flex-wrap:wrap}
.avrow .av{width:52px;height:52px;font-size:18px;border:0}
.qbox{width:52px;height:52px;border-radius:16px;border:2px dashed var(--line);display:grid;place-items:center;color:var(--faint);font-weight:800;font-size:17px}
.field{width:100%;height:52px;border-radius:14px;border:0;background:var(--card);padding:0 16px;font-size:16px;font-weight:600}
.field::placeholder{color:var(--faint);font-weight:500}

/* ---------- 02 ---------- */
.taste{border-radius:18px;border:1.5px solid var(--lime);background:var(--lime-soft);padding:12px 16px;display:flex;align-items:center;gap:10px;margin-bottom:14px}
.taste div{flex:1}
.taste p{margin:8px 0 0;font-size:12.5px;font-weight:600}
.taste.off{background:var(--card);border-color:transparent}
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pcard{background:var(--card);border-radius:20px;padding:14px;height:92px;text-align:left;display:flex;flex-direction:column;justify-content:space-between;position:relative}
.pcard .ic{width:36px;height:36px;border-radius:50%;background:var(--bg);display:grid;place-items:center;font-weight:800;font-size:14px;color:var(--ink)}
.pcard b{font-size:17px}
.pcard.on{background:var(--lime);color:#1F2022}
.pcard.on .ic{background:#fff;color:#1F2022}
.pcard.on::after{content:"";position:absolute;right:14px;top:14px;width:22px;height:22px;border-radius:50%;background:radial-gradient(circle,var(--lime) 0 4px,#1F2022 4.5px)}

/* ---------- 03 ---------- */
.monthbar{display:flex;justify-content:space-between;align-items:center;font-size:15px;font-weight:700;margin-bottom:12px}
.monthbar .nav{display:flex;gap:4px}
.monthbar .nav button{width:32px;height:32px;border-radius:50%;font-size:17px}
.monthbar .nav button[disabled]{opacity:.25}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.day{height:68px;border-radius:14px;background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px}
.day small{font-size:12px;color:var(--muted);font-weight:600}
.day b{font-size:19px}
.day.on{background:var(--btn);color:var(--btn-ink)}
.day.on small{color:inherit;opacity:.75}
.day[disabled]{opacity:.3}
.day.sun small{color:#E5484D}
.wheel{position:relative;height:150px;background:var(--card);border-radius:20px;overflow:hidden}
.wheel .band{position:absolute;left:16px;right:16px;top:50px;height:50px;border-radius:14px;background:var(--bg);pointer-events:none}
.wheel .list{position:relative;height:150px;overflow-y:scroll;scroll-snap-type:y mandatory;scrollbar-width:none;padding:50px 0;mask-image:linear-gradient(transparent,#000 30%,#000 70%,transparent)}
.wheel .list::-webkit-scrollbar{display:none}
.wheel .opt{height:50px;scroll-snap-align:center;display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:600;color:var(--muted);width:100%}
.wheel .opt.on{font-size:24px;font-weight:900;color:var(--ink)}

/* ---------- 04 ---------- */
.mecard{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:18px;padding:12px 14px}
.mecard div{flex:1;min-width:0}
.mecard b{display:block;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mecard span{font-size:12px;color:var(--muted)}
.mecard .chg{font-size:13px;font-weight:700;color:var(--muted);padding:6px}
.frow{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:18px;padding:10px 12px;margin-bottom:8px;width:100%;text-align:left}
.frow div{flex:1;min-width:0}
.frow b{display:block;font-size:14.5px}
.frow span{font-size:12px;color:var(--muted)}
.frow .chip{height:28px;font-size:12px;padding:0 12px}
.poke{background:#1F2022;color:#fff}
.poked{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.linkbar{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:10px 0 14px}
.linkbar button{height:50px;border-radius:14px;font-weight:700;font-size:15px;background:var(--card)}
.linkbar .kakao{background:#FEE500;color:#191600}

/* ---------- sheets ---------- */
.dim{position:fixed;inset:0;background:rgba(0,0,0,.42);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:440px;background:var(--bg);border-radius:26px 26px 0 0;padding:10px 20px calc(20px + env(safe-area-inset-bottom,0px));max-height:82vh;display:flex;flex-direction:column;animation:up .22s ease-out;overflow-y:auto}
.sheet h3{margin:0 0 4px;font-size:19px;font-weight:800}
.sheet .desc{font-size:13px;color:var(--muted);margin:0 0 12px}
@keyframes up{from{transform:translateY(40px);opacity:.5}}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 14px;flex:none}
.slist{overflow-y:auto;margin:8px -20px 0;padding:0 20px;min-height:200px}
.sitem{display:flex;align-items:center;justify-content:space-between;width:100%;padding:13px 4px;border-bottom:1px solid var(--line);font-size:15px;font-weight:600;text-align:left}
.lines{display:flex;gap:3px}
.ln{min-width:18px;height:18px;border-radius:9px;font-size:10.5px;font-weight:800;color:#fff;display:grid;place-items:center;padding:0 5px}
.opt-row{display:flex;align-items:center;justify-content:space-between;width:100%;padding:14px 4px;border-bottom:1px solid var(--line);font-size:16px;font-weight:700;text-align:left}
.opt-row.on{color:var(--lime-deep)}
.cand{display:block;width:100%;text-align:left;background:var(--card);border-radius:18px;padding:14px;margin-bottom:8px;border:2px solid transparent}
.cand.on{border-color:var(--lime-deep);background:var(--lime-soft)}
.cand .h{display:flex;justify-content:space-between;align-items:center;font-size:17px;font-weight:800}
.cand p{margin:6px 0 0;font-size:12.5px;line-height:1.55;color:var(--muted)}
.slider{margin-top:12px}
.slider .ends{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);font-weight:600;margin-top:4px}
input[type=range]{width:100%;accent-color:#6F8F00}

/* ---------- 05 / 06 / 08 maps ---------- */
.mapwrap{position:relative;margin:0 -24px;overflow:hidden;background:var(--map-bg);flex:none}
.mapwrap svg{width:100%;height:100%;display:block}
.mapbtns{position:absolute;top:14px;left:20px;right:20px;display:flex;justify-content:space-between;z-index:2}
.bsheet{background:var(--bg);border-radius:28px 28px 0 0;margin:-48px -24px 0;padding:10px 24px 0;position:relative;z-index:3;flex:1;display:flex;flex-direction:column;box-shadow:0 -4px 20px rgba(0,0,0,.06)}
.eyebrow{color:var(--lime-deep);font-size:13px;font-weight:800}
.hub-name{font-size:32px;font-weight:900;margin:2px 0 4px;letter-spacing:-0.04em}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:16px 0}
.stat{background:var(--card);border-radius:16px;height:64px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.stat small{font-size:12px;color:var(--muted);font-weight:600}
.stat b{font-size:20px;font-weight:900}
.bars{display:grid;grid-template-columns:34px 1fr 36px;gap:9px 12px;align-items:center;font-size:13px;font-weight:700}
.bars span:last-child,.bars .r{text-align:right}
.bar{height:8px;border-radius:4px;background:var(--card);overflow:hidden}
.bar i{display:block;height:100%;border-radius:4px;transition:width .3s}
.pill-head{position:absolute;top:14px;left:20px;right:20px;height:48px;background:var(--bg);border-radius:24px;box-shadow:0 2px 12px rgba(0,0,0,.12);display:flex;align-items:center;gap:6px;padding:0 16px 0 8px;z-index:2;font-weight:700;font-size:15px}
.pill-head .ttl{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.listhead{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.star{width:44px;height:44px;border-radius:14px;background:var(--lime);display:grid;place-items:center;font-size:20px;color:#1F2022;flex:none}
.listhead div{flex:1;min-width:0}
.listhead h2{font-size:18px;margin:0;font-weight:800}
.listhead p{margin:3px 0 0;font-size:12.5px;color:var(--muted)}
.place{display:flex;gap:14px;padding:8px 0 10px;align-items:flex-start;width:100%;text-align:left}
.thumb{width:72px;height:72px;border-radius:16px;flex:none;background:var(--card);position:relative;display:grid;place-items:center;font-size:24px;font-weight:900;color:var(--faint)}
.thumb i{position:absolute;left:6px;top:6px;width:14px;height:14px;border-radius:4px}
.place .info{flex:1;min-width:0}
.place h4{margin:2px 0 3px;font-size:16px;font-weight:800}
.place .m{font-size:12.5px;color:var(--muted)}
.tag{display:inline-block;font-size:11.5px;font-weight:700;padding:3px 8px;border-radius:10px;background:var(--card);margin:7px 4px 0 0}
.tag.fit{background:var(--lime);color:#1F2022}
.heart{font-size:14px;font-weight:800;display:flex;align-items:center;gap:3px;padding:2px 0 8px 8px;color:var(--faint)}
.heart.has{color:var(--heart)}
.heart.mine{transform:scale(1.1)}
.fab{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));right:max(24px,calc(50% - 196px));height:48px;padding:0 24px;border-radius:24px;background:var(--btn);color:var(--btn-ink);font-weight:800;font-size:15px;z-index:8;box-shadow:0 6px 16px rgba(0,0,0,.2)}
.sample{font-size:11.5px;color:var(--faint);margin:10px 0 90px;text-align:center}

/* vote sheet */
.tally{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center;margin-bottom:12px;font-size:14px;font-weight:700}
.tally .bar{grid-column:1/-1;height:10px;border-radius:5px}
.tally .bar i{background:var(--lime)}
.tally .who{display:flex}
.tally .who .av{width:20px;height:20px;font-size:9px;border-width:1.5px;margin-left:-5px}

/* ---------- 확정 ---------- */
.ticket{background:var(--lime);color:#1F2022;border-radius:28px;padding:22px;position:relative}
.ticket h2{font-size:28px;font-weight:900;margin:8px 0 16px;letter-spacing:-0.04em;line-height:1.25}
.ticket .kv{display:grid;grid-template-columns:52px 1fr;gap:8px;font-size:15px}
.ticket .kv span{font-weight:600;opacity:.6}
.ticket .kv b{font-weight:800}
.ticket .perf{border-top:2px dashed rgba(31,32,34,.25);margin:18px -22px 16px}
.dep{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;font-size:14px;font-weight:700;margin-bottom:8px}
.dep .av{width:28px;height:28px;font-size:11px;border-color:var(--lime)}
.dep em{font-style:normal;font-weight:600;opacity:.65;font-size:12.5px}
textarea.share{width:100%;height:124px;border-radius:16px;border:0;background:var(--card);padding:14px;font-size:13px;line-height:1.55;resize:none}

/* ---------- 07 ---------- */
.noti{background:var(--card);border-radius:22px;padding:16px}

.count{display:flex;justify-content:space-between;align-items:flex-end;margin:24px 0 8px}
.count small{font-size:14px;color:var(--muted);font-weight:700}
.count .big{font-size:50px;font-weight:900;letter-spacing:-0.04em;line-height:1.05}
.tl{position:relative;margin-top:14px}
.tl::before{content:"";position:absolute;left:21px;top:14px;bottom:14px;width:3px;background:var(--line);border-radius:2px}
.tstep{display:grid;grid-template-columns:20px 44px 1fr auto;gap:12px;align-items:center;height:52px;padding:0 12px;border-radius:16px;position:relative}
.tstep .dot{width:20px;height:20px;border-radius:50%;background:var(--bg);border:3px solid var(--line)}
.tstep.done .dot{background:var(--ink);border-color:var(--ink)}
.tstep.now{background:var(--lime-soft)}
.tstep.now .dot{background:var(--lime);border-color:#1F2022}
.tstep time{font-size:13px;font-weight:700;color:var(--muted)}
.tstep b{font-size:15px}
.tip{background:var(--card);border-radius:18px;padding:12px 16px;font-size:13px;line-height:1.55;margin-top:14px;display:flex;gap:10px;align-items:center}
.tip p{margin:0;flex:1}
.tip button{font-size:12px;font-weight:800;background:var(--lime);color:#1F2022;border-radius:12px;padding:8px 10px;flex:none}
.democlock{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 6px 0 12px;border-radius:15px;background:var(--card);font-size:12px;font-weight:800}

/* ---------- 08 ---------- */

.livedot{width:10px;height:10px;border-radius:50%;background:var(--live);box-shadow:0 0 0 0 rgba(34,197,94,.6);animation:pulse 1.6s infinite}
.livedot.off{background:var(--faint);animation:none}
@keyframes pulse{70%{box-shadow:0 0 0 8px rgba(34,197,94,0)}100%{box-shadow:0 0 0 0 rgba(34,197,94,0)}}
.racehead .r{font-variant-numeric:tabular-nums}
.demo-ctl{position:absolute;left:20px;top:76px;z-index:2}
.rank{display:grid;grid-template-columns:18px 32px 1fr 120px 44px;gap:10px;align-items:center;height:46px;font-size:14px;font-weight:700}
.rank .n{font-size:17px;font-weight:900;text-align:center}
.rank .av{width:32px;height:32px;font-size:12px;border:0}
.rank .bar{height:6px}
.rank .bar i{background:var(--lime)}
.rank .r{text-align:right;font-size:13px}
.rank.me{background:var(--lime-soft);border-radius:14px;margin:0 -8px;padding:0 8px;grid-template-columns:18px 32px 1fr 120px 44px}
.badge{position:absolute;top:-6px;right:-6px;min-width:20px;height:20px;border-radius:10px;background:var(--heart);color:#fff;font-size:11px;font-weight:800;display:grid;place-items:center;padding:0 5px}
.done-banner{background:var(--lime);color:#1F2022;border-radius:18px;padding:14px 16px;font-weight:800;margin-top:6px;font-size:15px}

/* ---------- 09 ---------- */
.track{background:var(--card);border-radius:18px;padding:16px 24px 10px;position:relative;height:70px;flex:none}
.track .rail{position:absolute;left:24px;right:24px;top:30px;height:4px;border-radius:2px;background:var(--line)}
.track .fill{position:absolute;left:24px;top:30px;height:4px;border-radius:2px;background:var(--lime)}
.track .av{position:absolute;top:19px;width:26px;height:26px;font-size:10px;transform:translateX(-50%);transition:left .3s}
.track .ends{position:absolute;left:12px;right:12px;bottom:6px;display:flex;justify-content:space-between;font-size:11px;color:var(--muted);font-weight:700}
.chatlog{flex:1;overflow-y:auto;padding:14px 0 8px;display:flex;flex-direction:column;gap:10px;min-height:300px}
.sys{align-self:center;background:var(--lime-soft);color:var(--ink);font-size:11.5px;font-weight:700;padding:5px 12px;border-radius:12px;text-align:center;max-width:90%}
.msg{display:flex;gap:8px;max-width:85%}
.msg .av{width:32px;height:32px;font-size:12px;border:0}
.msg small{display:block;font-size:12px;color:var(--muted);font-weight:700;margin-bottom:4px}
.bub{background:var(--card);padding:10px 14px;border-radius:4px 16px 16px 16px;font-size:14px;line-height:1.45;font-weight:500}
.msg.me{align-self:flex-end}
.msg.me .bub{background:var(--lime);color:#1F2022;border-radius:16px 4px 16px 16px}
.quick{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:6px 0}
.quick::-webkit-scrollbar{display:none}
.quick .chip{height:36px}
.composer{display:flex;align-items:center;gap:8px;background:var(--card);border-radius:18px;padding:6px 6px 6px 16px;margin-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
.composer input{flex:1;border:0;background:none;font-size:15px;height:40px;min-width:0}
.composer input:focus{outline:none}
.send{width:40px;height:40px;border-radius:50%;background:var(--btn);color:var(--btn-ink);font-size:18px;font-weight:800}
.chatwrap{position:sticky;bottom:0;background:var(--bg)}

/* ---------- 10 ---------- */
.podium{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:20px 0 10px}
.podium .p{background:var(--card);border-radius:16px;height:92px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;font-size:12px;font-weight:800}
.podium .p .av{width:32px;height:32px;font-size:12px;border:0}

.podium .p.first{background:var(--lime);color:#1F2022}
.wheelbox{position:relative;width:304px;height:304px;margin:26px auto 10px}
.wheelbox svg.w{width:100%;height:100%;transition:transform 4.2s cubic-bezier(.12,.72,.08,1)}
.pointer{position:absolute;left:50%;top:-14px;transform:translateX(-50%);z-index:2}
.go{position:absolute;left:50%;top:50%;width:64px;height:64px;margin:-32px 0 0 -32px;border-radius:50%;background:#1F2022;color:#fff;font-weight:900;font-size:16px;z-index:2;border:4px solid #fff;box-shadow:0 2px 10px rgba(0,0,0,.25)}
.verdict{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:60;display:grid;place-items:center;padding:24px}
.verdict .box{background:var(--lime);color:#1F2022;border-radius:28px;padding:28px 24px;width:100%;max-width:360px;text-align:center;animation:boom .45s cubic-bezier(.2,1.6,.4,1)}
@keyframes boom{from{transform:scale(.6);opacity:0}}
.verdict .box .av{width:64px;height:64px;font-size:24px;margin:0 auto 12px;border:4px solid #fff}
.verdict h2{font-size:30px;font-weight:900;margin:6px 0 20px;letter-spacing:-0.04em}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:61;overflow:hidden}
.confetti i{position:absolute;top:-20px;width:9px;height:14px;border-radius:2px;animation:fall 1.8s ease-in forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
.pen-row{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.pen-row input{flex:1;height:46px;border-radius:12px;border:0;background:var(--card);padding:0 14px;font-size:15px;font-weight:600}
.pen-row button{width:46px;height:46px;border-radius:12px;background:var(--card);font-size:18px}

/* ---------- v3: 시간 휠 2열 / 위치 / 초대 / 게스트 ---------- */
.wheel.two{display:grid;grid-template-columns:1.25fr 1fr}
.wheel.two .band{left:12px;right:12px}
.wheel .colon{position:absolute;left:55.5%;top:59px;font-size:22px;font-weight:900;pointer-events:none;z-index:1}
.timeread{display:flex;justify-content:space-between;align-items:baseline;margin:28px 0 10px}
.timeread b{font-size:15px}.timeread span{font-size:13px;color:var(--muted);font-weight:600}
.locsearch{display:flex;gap:8px;align-items:center;background:var(--card);border-radius:14px;padding:0 6px 0 14px;height:52px}
.locsearch input{flex:1;border:0;background:none;font-size:16px;font-weight:600;min-width:0;height:100%}
.locsearch input:focus{outline:none}
.gps{display:flex;align-items:center;gap:8px;width:100%;height:48px;border-radius:14px;background:var(--lime-soft);font-weight:800;font-size:14.5px;padding:0 14px;margin-top:10px;color:var(--ink)}

.lres{display:flex;gap:12px;align-items:center;width:100%;text-align:left;padding:12px 2px;border-bottom:1px solid var(--line)}
.lres .ic{width:34px;height:34px;border-radius:10px;background:var(--card);display:grid;place-items:center;font-size:15px;flex:none}

.picked{background:var(--card);border-radius:18px;padding:14px 16px;margin-top:12px}
.picked b{font-size:16px}.picked .m{font-size:12.5px;color:var(--muted);margin:3px 0 10px}
.stpick{display:flex;gap:8px;flex-wrap:wrap}
.stpick button{border-radius:12px;background:var(--bg);padding:8px 10px;font-size:13px;font-weight:700;display:flex;align-items:center;gap:6px;border:2px solid transparent}
.stpick button.on{border-color:#1F2022;background:var(--lime)}
.stpick small{font-weight:600;color:var(--muted)}.stpick button.on small{color:#1F2022;opacity:.7}
.frow .state{font-size:12px}
.frow .state.opened{color:var(--lime-deep);font-weight:700}
.kcard{border-radius:18px;overflow:hidden;background:#fff;color:#1F2022;box-shadow:0 2px 14px rgba(0,0,0,.12);margin:4px 0 14px}
.kcard .kimg{background:var(--lime);height:110px;position:relative;display:flex;align-items:flex-end;padding:14px;font-size:22px;font-weight:900;letter-spacing:-0.04em}
.kcard .kbody{padding:12px 14px}.kcard .kbody b{display:block;font-size:14.5px}.kcard .kbody span{font-size:12.5px;color:#707070}
.kcard .kbtn{border-top:1px solid #eee;text-align:center;padding:12px;font-size:14px;font-weight:700}
.kakaotag{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:800;color:#3C1E1E;background:#FEE500;border-radius:8px;padding:3px 8px;margin-bottom:8px}
.linkrow{display:flex;align-items:center;gap:8px;background:var(--card);border-radius:14px;padding:0 6px 0 14px;height:48px;font-size:13.5px;font-weight:700}
.linkrow span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.linkrow button{height:36px;padding:0 12px;border-radius:10px;background:var(--bg);font-weight:800;font-size:13px}
.howto{font-size:12.5px;color:var(--muted);line-height:1.6;margin:12px 0 0;padding:0;list-style:none;counter-reset:h}
.howto li{counter-increment:h;display:flex;gap:8px;margin-bottom:4px}
.howto li::before{content:counter(h);width:18px;height:18px;border-radius:50%;background:var(--card);font-size:11px;font-weight:800;display:grid;place-items:center;flex:none;color:var(--ink);margin-top:1px}
.guestbar{display:flex;align-items:center;justify-content:space-between;height:56px;font-size:12px;color:var(--muted);font-weight:700}
.invite-hero{background:var(--lime);color:#1F2022;border-radius:28px;padding:22px}
.invite-hero h2{font-size:28px;font-weight:900;margin:10px 0 14px;letter-spacing:-0.04em;line-height:1.25}
.invite-hero .kv{display:grid;grid-template-columns:44px 1fr;gap:6px;font-size:14px}
.invite-hero .kv span{opacity:.6;font-weight:600}
.demo-note{font-size:11.5px;color:var(--faint);text-align:center;margin:10px 0 0}
.pdetail .top2{display:flex;gap:14px;align-items:center;margin-bottom:12px}
.pdetail .thumb{width:64px;height:64px}
.pdetail h3{font-size:20px}
.kov-av{width:40px;height:40px;border-radius:50%;border:3px solid #fff;display:grid;place-items:center;font-weight:800;color:#1F2022;box-shadow:0 2px 6px rgba(0,0,0,.2);font-family:var(--font)}
.kov-tag{background:#fff;border-radius:10px;padding:2px 8px;font-size:11px;font-weight:700;margin-top:4px;text-align:center;font-family:var(--font);color:#1F2022}
.kov-pin{background:#1F2022;color:#fff;border-radius:15px;padding:6px 12px;font-size:13px;font-weight:800;font-family:var(--font);white-space:nowrap}

.fun .bar i{background:var(--lime)}

.mecard{background:var(--bg);border:2px solid var(--lime)}

.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--card);border-radius:14px;padding:4px;margin:-8px 0 22px}

.slots{display:flex;flex-wrap:wrap;gap:8px}
.slot{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 6px 0 14px;border-radius:18px;background:var(--lime);color:#1F2022;font-size:13.5px;font-weight:700}
.slot button{width:24px;height:24px;border-radius:50%;background:rgba(31,32,34,.12);font-size:11px}
.slot-add{border:2px dashed var(--line);background:none}
.availrow{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--card);border-radius:16px;padding:14px;margin-bottom:8px;border:2px solid transparent}
.availrow.on{background:var(--lime-soft);border-color:var(--lime)}
.availrow .ck{width:24px;height:24px;border-radius:8px;border:2px solid var(--line);display:grid;place-items:center;font-weight:900;font-size:14px;flex:none;background:var(--bg)}

.availrow b{flex:1;font-size:15px}
.availrow small{font-size:12px;color:var(--muted);font-weight:700}
.tally2{display:grid;grid-template-columns:1fr auto;gap:5px 10px;align-items:center;margin-bottom:12px;font-size:14px;font-weight:700}

.tally2 .who{display:flex}.tally2 .who .av{width:20px;height:20px;font-size:9px;border-width:1.5px;margin-left:-5px}
.best-tag{font-size:11px;font-weight:800;background:var(--lime);color:#1F2022;border-radius:8px;padding:2px 7px;margin-left:6px}
.deny{background:#FFF1F2;border-radius:18px;padding:16px;margin-top:12px;color:#1F2022}
.deny b{font-size:16px}.deny p{font-size:13px;line-height:1.6;margin:8px 0 14px;color:#5B5B5B}
.fb{display:flex;align-items:center;gap:8px;margin-top:16px;font-size:13.5px;font-weight:700;flex-wrap:wrap}
.fb span{flex:1;min-width:120px}
.taste.empty{background:var(--card);border:1.5px dashed var(--line)}
.taste.empty .chip{background:var(--line);color:var(--muted)}
</style>

function hav(a,b){const R=6371,t=Math.PI/180,dLa=(b.lat-a.lat)*t,dLo=(b.lng-a.lng)*t;
  const x=Math.sin(dLa/2)**2+Math.cos(a.lat*t)*Math.cos(b.lat*t)*Math.sin(dLo/2)**2;return 2*R*Math.asin(Math.sqrt(x));}
// 대중교통 이동시간 추정: 도보·대기 6분 + 거리(×1.3 굴곡)×2분/km + 환승×5분  → 배포 시 ODsay/카카오 API로 교체
function travel(o,h){
  if(o.name===h.name) return {t:4,tr:0};
  const d=hav(o,h)*1.3, shared=o.lines.some(l=>h.lines.includes(l));
  const tr=shared?0:(d>24?2:1);
  return {t:Math.round(6+d*2.0+tr*5),tr};
}

  if(A.arr&&B.arr)return A.arr-B.arr;if(A.arr)return -1;if(B.arr)return 1;return rankScore(B)-rankScore(A)})}
function allArrived(R,m){return m.people.every((_,i)=>liveOf(R,i).arr)}
function arrivedCount(R,m){return m.people.filter((_,i)=>liveOf(R,i).arr).length}
function remText(L){if(L.arr)return "도착";if(L.phase==="moving")return L.eta!=null?`${Math.max(1,L.eta)}분`:`${Math.round(L.progress*100)}%`;if(L.phase==="prep")return "준비 중";return "출발 전"}
/* ---- 서버 동기화 ---- */
async function pushMine(R,force){if(!ONLINE()||!R.code)return;const now=Date.now();if(!force&&now-R.lastPush<10000)return;R.lastPush=now;const L=R.me;
  const {error}=await SB.from("participants").update({phase:L.phase,prep_step:L.step,status:L.status,progress:L.progress,departed_at:L.dep,arrived_at:L.arr,eta:L.eta,gps:L.gps}).eq("code",R.code).eq("device_id",DEVICE);
  if(error)console.warn("pushMine",error.message)}
async function loadLive(R,m){if(!ONLINE()||!R.code)return;
  const [{data:rows},{data:msgs}]=await Promise.all([SB.from("participants").select("*").eq("code",R.code),SB.from("messages").select("*").eq("code",R.code).order("id")]);
  if(!S.race||S.race!==R)return;
  const prevArr=m.people.map((_,i)=>!!liveOf(R,i).arr);
  (rows||[]).forEach(r=>{const i=m.people.findIndex(p=>p.id&&p.id===r.id);if(i>0)R.others[i]=rowLive(r);
    if(i===0&&R.me.phase==="idle"&&r.phase&&r.phase!=="idle")R.me=rowLive(r)});
  if(msgs){const before=R.chat.length;R.chat=msgs.map(x=>({id:x.id,sys:x.sys,text:x.text,name:x.name,mine:x.device_id===DEVICE}));
    if(R.loaded&&S.screen!=="chat")R.unread+=Math.max(0,R.chat.length-before);}
  if(R.loaded)m.people.forEach((_,i)=>{if(i>0&&!prevArr[i]&&R.others[i].arr&&["today","race"].includes(S.screen))toast(`${nameOf(m,i)}님이 도착했어요`)});
  R.loaded=true;if(["today","race","chat","roulette"].includes(S.screen))render(true)}
function liveSubscribe(R,m){if(!ONLINE()||!R.code)return;if(window.__liveCh)SB.removeChannel(window.__liveCh);
  window.__liveCh=SB.channel("live-"+R.code)
    .on("postgres_changes",{event:"UPDATE",schema:"public",table:"participants",filter:`code=eq.${R.code}`},()=>loadLive(R,m))
    .on("postgres_changes",{event:"INSERT",schema:"public",table:"messages",filter:`code=eq.${R.code}`},()=>loadLive(R,m))
    .subscribe(st=>{if(st==="SUBSCRIBED")loadLive(R,m)});
  clearInterval(window.__raceIv);window.__raceIv=setInterval(()=>{if(document.visibilityState==="visible"&&window.__raceP)window.__raceP()},8000);
  window.__raceP=()=>{if(S.race===R&&["today","race","chat","roulette"].includes(S.screen))loadLive(R,m)};loadLive(R,m)}
async function postMsg(R,m,text,sys){const item={sys:!!sys,text,name:PROFILE.name,mine:true};
  if(ONLINE()&&R.code){const {error}=await SB.from("messages").insert({code:R.code,device_id:DEVICE,name:PROFILE.name,text,sys:!!sys});
    if(error){toast("메시지를 보내지 못했어요");return}loadLive(R,m)}
  else{R.chat.push(item);store.set("mg3_chat_"+R.mid,R.chat.slice(-200));if(["chat","race","today"].includes(S.screen))render(true)}}
/* ---- 위치 기반 진행률 (좌표는 기기 안에서만 사용) ---- */
function startGps(R,m){if(R.watch!=null||!navigator.geolocation)return;const hub=byName(m.hub);
  R.watch=navigator.geolocation.watchPosition(pos=>{if(S.race!==R||R.me.phase!=="moving")return;
    const d=hav({lat:pos.coords.latitude,lng:pos.coords.longitude},hub)*1000;
    if(R.startDist==null)R.startDist=Math.max(d,ARRIVE_M*3);
    const L=R.me;L.gps=true;L.progress=Math.max(0,Math.min(0.99,1-d/R.startDist));
    const el=(Date.now()-L.dep)/6e4,covered=R.startDist-d;
    L.eta=covered>250&&el>1.5?Math.ceil(d/(covered/el)):Math.max(1,Math.round(m.legs[0]*(1-L.progress)));
    L.status=d<800?"곧 도착":"이동중";saveMine(R);pushMine(R,false);
    if(d<=ARRIVE_M){toast("약속 장소 근처예요. 도착으로 표시했어요");A.arrive();return}
    if(["today","race","chat"].includes(S.screen))render(true)},
  err=>{R.me.gps=false;R.watch=null;if(err.code===1)toast("위치 권한이 없어서 예상 이동시간으로 진행돼요")},{enableHighAccuracy:true,maximumAge:10000,timeout:30000})}
function stopGps(R){if(R&&R.watch!=null&&navigator.geolocation){navigator.geolocation.clearWatch(R.watch)}if(R)R.watch=null}
/* 1초마다: 실제 시계로 화면 갱신, 위치가 없으면 예상시간으로 진행 */
setInterval(()=>{const R=S.race;if(!R)return;const m=getMeeting(R.mid);if(!m)return;const L=R.me;
  if(L.phase==="moving"&&!L.gps){const el=(Date.now()-L.dep)/6e4;L.progress=Math.min(0.95,el/Math.max(1,m.legs[0]));L.eta=Math.max(1,Math.ceil(m.legs[0]-el));L.status=L.eta<=5?"곧 도착":"이동중";saveMine(R);pushMine(R,false)}
  if(["today","race"].includes(S.screen))render(true)},1000);

    <div class="pill-head"><button class="icon-btn" data-a="go" data-v="result" aria-label="뒤로">←</button><span class="ttl">${esc(hub.name)}역 주변 · ${ps.join(" · ")}</span></div></div>
  <div class="bsheet"><div class="grab"></div>
  <div class="listhead"><span class="star">★</span><div><h2>${esc(title)}</h2><p>장소 ${S.places.length} · ${ps.join("·")}${d.vibes.length?" · "+d.vibes.map(i=>VIBES[i]).join("·")+" 분위기":""}</p></div><button class="icon-btn" style="background:var(--card)" data-a="shareList" aria-label="리스트 공유">↗</button></div>

  ${shown.map(p=>{const mine=p.votes.includes(0);
    return `<div class="place" data-a="placeOpen" data-v="${p.id}" style="cursor:pointer"><button class="thumb" data-a="placeOpen" data-v="${p.id}" aria-label="${esc(p.name)} 자세히 보기"><i style="background:${CAT_COLOR[p.cat]}"></i>${CAT_SHORT[p.cat]}</button>

    <span class="tag fit">취향 ${p.fit}%</span>${p.second?`<span class="tag">2차</span>`:d.vibes.slice(0,1).map(i=>`<span class="tag">${VIBES[i]}</span>`).join("")}</div>
    <button class="heart ${p.votes.length?"has":""} ${mine?"mine":""}" data-a="heart" data-v="${p.id}" aria-pressed="${mine}" aria-label="${esc(p.name)} 찜">${mine||p.votes.length?"♥":"♡"} ${p.votes.length}</button></div>`}).join("")}

  <button class="fab" data-a="startVote">투표로 정하기</button></div>`};

function shareText(m){return `📍 ${m.name} 확정!\n${fmtDate(m.date)} ${fmtTime(m.time)}\n${m.hub}역 · ${m.place}\n\n출발 시간 (${BUFFER}분 여유)\n${m.people.map((p,i)=>`${i===0?PROFILE.name:p.name} ${hhmm(depOf(m,i))} 출발 · ${p.st}역 ${m.legs[i]}분`).join("\n")}\n\n당일엔 모일곳에서 도착 레이스 🏁`}

/* 07 */
function myAction(R,m){const L=R.me,plan=prepPlan(m);
  if(L.phase==="idle")return {a:"startPrep",t:"준비 시작 · 친구들에게 상태 공유"};
  if(L.phase==="prep"&&L.step<plan.length)return {a:"nextStep",t:`${plan[L.step].name} 끝! 다음 단계로`};
  if(L.phase==="prep")return {a:"depart",t:"출발! 도착 레이스 시작"};
  if(L.phase==="moving")return {a:"arrive",t:"도착했어요"};
  return null}
V.today=()=>{const m=getMeeting(S.cur),R=S.race,L=R.me,plan=prepPlan(m),dep=depMs(m),now=Date.now(),arrPlan=dep+m.legs[0]*6e4,act=myAction(R,m);
  const left=Math.round((dep-now)/6e4);
  const rows=[...plan.map((s,k)=>({at:s.at,name:s.name,chip:`${s.dur}분`,st:L.phase==="idle"?"":(L.phase!=="prep"||k<L.step)?"done":k===L.step?"now":""})),
    {at:dep,name:"출발!",chip:`대중교통 ${m.legs[0]}분`,st:["moving","arrived"].includes(L.phase)?"done":(L.phase==="prep"&&L.step>=plan.length)?"now":""},
    {at:arrPlan,name:`${m.hub}역 도착`,chip:L.arr?`${hmMs(L.arr)} 도착`:`여유 ${BUFFER}분`,st:L.arr?"done":L.phase==="moving"?"now":""}];
  const head=L.phase==="idle"?{b:`${hmMs(dep)}에 출발해야 늦지 않아요!`,s:`${hmMs(plan[0]?.at??dep)}부터 준비하면 딱 맞아요 · ${esc(m.name)}`}
    :L.phase==="prep"?{b:L.step<plan.length?`지금은 ${plan[L.step].name} 차례예요`:"준비 끝! 출발하면 레이스가 시작돼요",s:`${hmMs(dep)} 출발 목표 · ${esc(m.name)}`}
    :L.phase==="moving"?{b:`${m.hub}역으로 이동 중 · 약 ${Math.max(1,L.eta??m.legs[0])}분 남았어요`,s:L.gps?"위치로 진행률을 계산 중 · 좌표는 공유되지 않아요":"위치 권한이 없어 예상 이동시간으로 진행 중"}
    :{b:`${hmMs(L.arr)}에 도착했어요!`,s:`친구들이 오는 모습은 도착 레이스에서 볼 수 있어요`};
  const big=L.phase==="moving"?{k:"도착까지",v:`${Math.max(1,L.eta??m.legs[0])}분`}:L.phase==="arrived"?{k:"도착 시간",v:hmMs(L.arr)}:{k:"출발까지",v:left>0?(left>=60?`${Math.floor(left/60)}시간 ${left%60}분`:`${left}분`):left===0?"지금!":`${-left}분 지남`};
  return `<div class="scr"><div class="top">${backBtn("home")}<h1>오늘의 약속</h1><span class="chip sm">${fmtShort(m.date)} ${hmMs(meetStart(m))}</span></div>
  <div class="noti"><div class="src"><i>모</i>모일곳 · 지금</div><b>${head.b}</b><span>${head.s}</span></div>
  <div class="count"><div><small>${big.k}</small><div class="big">${big.v}</div></div><span class="chip on">도착 예정 ${hmMs(L.phase==="moving"&&L.eta!=null?now+L.eta*6e4:arrPlan)}</span></div>
  <div class="label" style="margin-top:18px">준비 코칭 <small>단계마다 버튼을 눌러 넘겨요</small></div>
  <div class="tl">${rows.map(r=>`<div class="tstep ${r.st}"><span class="dot"></span><time>${hmMs(r.at)}</time><b>${esc(r.name)}</b><span class="chip xs ${r.st==="now"?"on":""}" style="${r.st==="now"?"":"background:var(--card)"}">${r.chip}</span></div>`).join("")}</div>
  ${L.phase==="idle"?`<div class="tip"><p>지난 약속엔 준비가 평균 ${PROFILE.lateAvg}분 더 걸렸어요. 10분 일찍 시작해볼까요?</p>${PROFILE.early?`<button data-a="early" data-v="0">원래대로</button>`:`<button data-a="early" data-v="10">10분 당기기</button>`}</div>`:""}
  ${L.phase==="prep"?`<button class="chip sm" data-a="prevStep" style="margin-top:12px">↺ 이전 단계로</button>`:""}
  <div class="spacer"></div><div class="cta-bar">${act&&L.phase!=="moving"?`<button class="btn" data-a="${act.a}">${act.t}</button>`:`<div class="row2"><button class="btn ghost" data-a="go" data-v="race">도착 레이스 보기</button>${act?`<button class="btn" data-a="${act.a}">${act.t}</button>`:`<button class="btn" data-a="go" data-v="chat">채팅</button>`}</div>`}
  ${L.phase!=="moving"&&act?`<button class="btn ghost sm" data-a="go" data-v="race" style="margin-top:8px">친구들 현황 · 도착 레이스 보기</button>`:""}</div></div>`};
/* 08 */
V.race=()=>{const m=getMeeting(S.cur),R=S.race,W=390,H=560,now=Date.now();
  const sts=m.people.map(ptOf),hub=byName(m.hub),P=projector([hub,...sts],W,H,{l:56,r:56,t:140,b:110},4);
  const [hx,hy]=P.f(hub.lat,hub.lng),origins=spreadPts(sts.map(s=>[...P.f(s.lat,s.lng),s.name]));
  let svg=`<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid slice" role="img" aria-label="도착 레이스 지도">${mapBase(P,W,H)}`;
  origins.forEach(([x,y])=>svg+=`<line x1="${x}" y1="${y}" x2="${hx}" y2="${hy}" stroke="#1F2022" stroke-width="2.5" stroke-dasharray="3 6" stroke-linecap="round" opacity=".55"/>`);
  svg+=hubPin(hx,hy,m.hub+"역");
  const order=rankOrder(R,m);let ai=0;
  origins.forEach(([ox,oy],i)=>{const L=liveOf(R,i);let x,y;
    if(L.arr){const a=(ai++)*1.3+0.6;x=hx+Math.cos(a)*34;y=hy+22+Math.sin(a)*14}else{const pr=L.phase==="moving"?Math.min(0.9,L.progress):0;x=ox+(hx-ox)*pr;y=oy+(hy-oy)*pr}
    const st=L.arr?"도착!":L.status,w=st.length*11+22,rk=order.indexOf(i)+1,fill=L.arr?"#C8F135":L.phase==="prep"?"#FFD6DE":L.phase==="idle"?"#F2F2EE":"#FFFFFF";
    svg+=`<g>${avatarSvg(x,y,23,nameOf(m,i),i)}<rect x="${x-w/2}" y="${y-58}" width="${w}" height="26" rx="13" fill="${fill}" stroke="#1F2022" stroke-opacity=".08"/><text x="${x}" y="${y-40.5}" text-anchor="middle" font-size="11.5" font-weight="800" fill="#1F2022">${esc(st)}</text>
    <rect x="${x+13}" y="${y-28}" width="22" height="22" rx="7" fill="#1F2022"/><text x="${x+24}" y="${y-12.5}" text-anchor="middle" font-size="12" font-weight="900" fill="#fff">${rk}</text></g>`});
  svg+=`</svg>`;
  const left=meetStart(m)-now,mm=Math.floor(Math.max(0,left)/6e4),ss=Math.floor((Math.max(0,left)%6e4)/1000),live=m.people.some((_,i)=>liveOf(R,i).phase==="moving");
  const done=allArrived(R,m),canRoul=done||arrivedCount(R,m)>=2&&now>=meetStart(m);
  return `<div class="scr"><div class="mapwrap" style="height:560px">${svg}
    <div class="racehead"><span class="l">${backBtn("today")}<i class="livedot ${live?"":"off"}" style="animation-delay:-${((performance.now()/1000)%1.6).toFixed(2)}s"></i>도착 레이스</span><span class="r">${left<=0?`약속 시간 ${hmMs(meetStart(m))}`:mm>=60?`약속까지 ${Math.floor(mm/60)}시간 ${mm%60}분`:`약속까지 ${String(mm).padStart(2,"0")}:${String(ss).padStart(2,"0")}`}</span></div></div>
  <div class="bsheet"><div class="grab"></div>
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px"><b style="font-size:17px">실시간 순위</b><button class="chip sm" data-a="statusSheet">내 상태: ${esc(R.me.arr?"도착!":R.me.status)} ▼</button></div>
  ${order.map((i,k)=>{const L=liveOf(R,i),t=remText(L);return `<div class="rank ${i===0?"me":""}"><span class="n">${k+1}</span>${av(nameOf(m,i),i)}<span>${i===0?esc(PROFILE.name)+" (나)":esc(nameOf(m,i))}</span><div class="bar"><i style="width:${(L.arr?1:L.phase==="moving"?L.progress:0)*100}%"></i></div><span class="r ${t==="출발 전"&&now>depMs(m)?"late":""}">${t}</span></div>`}).join("")}
  ${done?`<div class="done-banner">🎉 모두 모였어요! 꼴찌 ${esc(nameOf(m,order[order.length-1]))}님, 룰렛 돌릴 시간이에요</div>`:!ONLINE()?`<p class="note" style="font-size:12px;color:var(--faint);margin-top:8px">온라인 연결이 없어 내 진행만 보여요</p>`:""}
  <div class="spacer"></div><div class="cta-bar"><div class="row2" style="grid-template-columns:120px 1fr"><button class="btn ghost" data-a="go" data-v="chat" style="position:relative;height:52px">채팅${R.unread?`<span class="badge">${R.unread}</span>`:""}</button>${canRoul?`<button class="btn lime" data-a="toRoulette" style="height:52px">${done?"벌칙 룰렛 돌리기":"지금 모인 사람으로 룰렛"}</button>`:`<button class="btn" data-a="statusSheet" style="height:52px">상태 바꾸기</button>`}</div></div></div></div>`};
/* 09 */
V.chat=()=>{const m=getMeeting(S.cur),R=S.race;R.unread=0;
  const pr=i=>{const L=liveOf(R,i);return L.arr?1:L.phase==="moving"?L.progress:0},lead=Math.max(...m.people.map((_,i)=>pr(i)));
  const idxOf=n=>{const i=m.people.findIndex((p,k)=>nameOf(m,k)===n);return i<0?5:i};
  return `<div class="scr"><div class="top">${backBtn("race")}<div style="flex:1"><h1>${esc(m.name)}</h1><div class="sub2">${m.people.length}명 · ${allArrived(R,m)?"레이스 종료":m.people.some((_,i)=>liveOf(R,i).phase==="moving")?"레이스 진행 중":"출발 전"}</div></div></div>
  <div class="track"><div class="rail"></div><div class="fill" style="width:calc((100% - 48px) * ${lead})"></div>
    ${m.people.map((_,i)=>`<span class="av" style="left:calc(24px + (100% - 48px) * ${pr(i)});background:${avc(i)};z-index:${10-i}">${esc(initial(nameOf(m,i)))}</span>`).join("")}
    <div class="ends"><span>출발</span><span>도착</span></div></div>
  <div class="chatlog" id="chatlog">${R.chat.length?R.chat.map(c=>c.sys?`<div class="sys">${esc(c.text)}</div>`:c.mine?`<div class="msg me"><div class="bub">${esc(c.text)}</div></div>`:
    `<div class="msg">${av(c.name||"?",idxOf(c.name))}<div><small>${esc(c.name||"친구")}</small><div class="bub">${esc(c.text)}</div></div></div>`).join(""):`<div class="sys">아직 메시지가 없어요. 필요할 때 한마디 남겨보세요</div>`}</div>
  <div class="chatwrap"><div class="quick">${(allArrived(R,m)?["룰렛 돌리자","벌칙 뭐 나올까ㅋㅋ","다들 고생했어"]:["곧 도착","5분만","먼저 들어가 있어"]).map(q=>`<button class="chip" data-a="quick" data-v="${q}">${q}</button>`).join("")}</div>
  <div class="composer"><input id="chatin" data-in="chat" placeholder="메시지 보내기" value="${esc(S.chatDraft)}" autocomplete="off" aria-label="메시지 입력" enterkeyhint="send"><button class="send" data-a="send" aria-label="보내기">↑</button></div></div></div>`};
/* 10 */
V.roulette=()=>{const m=getMeeting(S.cur),R=S.race,rl=S.roul,order=rankOrder(R,m),loser=order[order.length-1];
  const items=rl.mode==="last"?rl.pens:m.people.map((p,i)=>nameOf(m,i));
  const n=items.length,cols=["#C8F135","#1F2022","#F2F2EE"],c=150,r=148;
  const pt=a=>[c+r*Math.sin(a*Math.PI/180),c-r*Math.cos(a*Math.PI/180)];
  let slices="";items.forEach((t,k)=>{const a0=k*360/n,a1=(k+1)*360/n,[x0,y0]=pt(a0),[x1,y1]=pt(a1),mid=(a0+a1)/2;
    slices+=`<path d="M${c} ${c}L${x0} ${y0}A${r} ${r} 0 ${a1-a0>180?1:0} 1 ${x1} ${y1}Z" fill="${n%3===1&&k===n-1&&n>1?"#FFFFFF":cols[k%3]}" stroke="#1F2022" stroke-width="2"/>
    <text x="${c}" y="${c-r*0.64}" text-anchor="middle" font-size="${t.length>5?12:13.5}" font-weight="800" fill="${k%3===1&&!(n%3===1&&k===n-1)?"#FFFFFF":"#1F2022"}" transform="rotate(${mid} ${c} ${c})">${esc(t)}</text>`});

  gRace:()=>{const p=S.d.people[S.guest.idx];p.race=p.race===false;render(true);if(ONLINE())guestSave({race:p.race!==false})},
  gPush:()=>{const p=S.d.people[S.guest.idx];p.push=p.push===false;render(true);if(ONLINE())guestSave({push:p.push!==false})},
  resume:()=>{const dr=store.get("mg3_draft",null);if(!dr)return;S.d=dr.d;S.guest=null;if(ONLINE()&&S.d.synced)hostSubscribe(S.d.code);go(dr.screen)},
  dropDraft:()=>{store.set("mg3_draft",null);render(true)},
  gNext:()=>{track("guest_to_host");S.guest=null;resetUrl();A.new()},
  guestDay:()=>{clearInterval(window.__guestIv);if(!PROFILE.name){const me=S.d.people[S.guest.idx];if(me&&me.name){PROFILE.name=me.name;saveProfile()}}saveGuestMeeting();const id="c-"+S.guest.code;S.guest=null;resetUrl();A.openMeet(id)},
  gHome:()=>{S.guest=null;resetUrl();go("home")},
  ics:()=>downloadIcs(),
  placeOpen:v=>{S.focus=+v;S.sheet={type:"place",id:+v};render(true)},
  find:()=>{if(ONLINE()){S.d.people=S.d.people.filter(p=>p.st);S.d.count=S.d.people.length}S.fb=null;
    if(S.d.mode==="poll"&&S.d.slots.length){const t=pollTally(S.d),b=t.best;S.d.date=S.d.slots[b].date;S.d.time=S.d.slots[b].time;toast(`${fmtSlot(S.d.slots[b])}로 정했어요 · ${t.counts[b]}/${S.d.people.length}명 가능`);track("time_poll_decided",{slots:S.d.slots.length})}
    track("origins_done");S.sel=0;S.real=false;runRecommend();track("result_view");go("result");refineWithTransit()},
  cands:()=>{S.sheet={type:"cands"};render(true)},
  cand:v=>{S.sel=+v;S.sheet=null;render(true)},
  shareResult:()=>{const r=S.results[S.sel];copyText(`[모일곳] 우리 ${r.hub.name}역에서 만나자! 평균 ${r.avg}분, 최대 차이 ${r.spread}분`)},
  places:()=>{const d=S.d;S.places=genPlaces(S.results[S.sel].hub,d.purposes,d.vibes,d.taste);S.filter=-1;S.focus=null;track("places_view");go("places")},
  filter:v=>{S.filter=+v;S.focus=null;render(true)},
  focus:v=>{S.focus=+v;render(true)},
  heart:v=>{const p=S.places.find(x=>x.id===+v);p.votes.includes(0)?p.votes=p.votes.filter(x=>x!==0):p.votes.push(0);S.focus=p.id;render(true)},
  shareList:()=>{copyText(S.places.slice(0,5).map((p,i)=>`${i+1}. ${p.name} (${PURPOSES[p.cat][2]}, 도보 ${p.walk}분)`).join("\n"),"추천 리스트를 복사했어요")},
  startVote:()=>{track("vote_start");S.sheet={type:"vote"};render(true);
    if(S.voteSim)return;if(!S.places.some(p=>p.votes.includes(0)))return;
    S.voteSim=true;const d=S.d,rnd=seeded(d.people.map(p=>p.name).join());
    d.people.slice(1).forEach((p,k)=>setTimeout(()=>{if(!S.places)return;const i=k+1;
      const pool=[...S.places].sort((a,b)=>(b.fit+b.votes.length*5+rnd()*30)-(a.fit+a.votes.length*5+rnd()*30));
      if(!pool[0].votes.includes(i))pool[0].votes.push(i);if(S.screen==="places")render(true)},900+k*1100))},
  confirm:v=>{const d=S.d,r=S.results[S.sel],win=v!=null?S.places.find(x=>x.id===+v):[...S.places].sort((a,b)=>b.votes.length-a.votes.length||b.fit-a.fit)[0];if(v!=null)track("solo_pick");
    const name=d.name.trim()||`${DOW[new Date(d.date).getDay()]}요일 모임`;
    const m={id:"m"+Date.now(),name,date:d.date,time:d.time,hub:r.hub.name,place:win.name,placeCat:win.cat,votes:win.votes.length,purposes:d.purposes,vibes:d.vibes,alarm:d.alarm,share:d.share,
      people:d.people.map((p,i)=>({id:p.id,name:i===0?PROFILE.name:p.name,st:p.st,acc:p.acc,loc:p.loc})),legs:r.legs.map(l=>l.t),status:"upcoming",solo:v!=null};
    if(ONLINE()&&d.synced){m.id="c-"+d.code;m.code=d.code;const legs={};d.people.forEach((p,i)=>{if(p.id)legs[p.id]=r.legs[i].t});
      SB.from("meetings").update({status:"confirmed",date_ts:d.date,time_min:d.time,hub:r.hub.name,place:win.name,place_cat:win.cat,legs,solo:v!=null}).eq("code",d.code).then(({error})=>{if(error)toast("저장 실패: "+error.message)})}
    store.set("mg3_draft",null);putMeeting(m);S.cur=m.id;S.voteSim=false;S.places=null;track("confirmed",{solo:v!=null});go("done")},
  copyShare:()=>copyText(shareText(getMeeting(S.cur))),
  openMeet:v=>{const m=getMeeting(v);if(!m){toast("약속을 찾지 못했어요");return}S.cur=v;startRaceFor(m);go(S.race.me.phase==="moving"||S.race.me.arr?"race":"today")},
  bell:()=>{const up=meetings().filter(m=>m.status==="upcoming").sort((a,b)=>a.date-b.date)[0];if(!up){toast("다가오는 약속이 없어요");return}A.openMeet(up.id)},
  openRec:v=>{const m=getMeeting(v);toast(m.result?`1등 ${m.people[m.result.order[0]].name} · 벌칙 ${m.result.penalty} (${m.people[m.result.loser].name})`:"기록이 없어요")},
  early:v=>{PROFILE.early=+v;saveProfile();render(true)},
  startPrep:()=>{const R=S.race,m=getMeeting(S.cur),plan=prepPlan(m),L=R.me;L.phase="prep";L.step=0;L.status=plan.length?ingOf(plan[0].name):"곧 나감";
    saveMine(R);pushMine(R,true);postMsg(R,m,`${PROFILE.name}님이 준비를 시작했어요`,true);track("race_start");toast("친구들에게 준비 시작을 알렸어요");render(true)},
  nextStep:()=>{const R=S.race,m=getMeeting(S.cur),plan=prepPlan(m),L=R.me;if(L.phase!=="prep")return;L.step=Math.min(plan.length,L.step+1);
    L.status=L.step<plan.length?ingOf(plan[L.step].name):"곧 나감";saveMine(R);pushMine(R,true);S.sheet=null;render(true)},
  prevStep:()=>{const R=S.race,m=getMeeting(S.cur),plan=prepPlan(m),L=R.me;if(L.phase!=="prep"||L.step===0)return;L.step--;L.status=ingOf(plan[L.step].name);saveMine(R);pushMine(R,true);render(true)},
  depart:()=>{const R=S.race,m=getMeeting(S.cur),L=R.me;L.phase="moving";L.dep=Date.now();L.progress=0;L.eta=m.legs[0];L.status="이동중";L.gps=false;R.startDist=null;
    saveMine(R);pushMine(R,true);startGps(R,m);postMsg(R,m,`${PROFILE.name}님이 출발했어요`,true);track("depart");S.sheet=null;go("race")},
  arrive:()=>{const R=S.race,m=getMeeting(S.cur),L=R.me;if(L.arr)return;if(!L.dep)L.dep=Date.now();L.phase="arrived";L.arr=Date.now();L.progress=1;L.eta=0;L.status="도착!";stopGps(R);
    const k=m.people.filter((_,i)=>liveOf(R,i).arr).length;saveMine(R);pushMine(R,true);postMsg(R,m,`${PROFILE.name}님이 ${k}등으로 도착했어요`,true);track("arrive");toast(`${k}등으로 도착! 🎉`);S.sheet=null;go("race")},
  statusSheet:()=>{S.sheet={type:"status"};render(true)},
  quick:v=>{S.sheet=null;sendChat(v)},
  send:()=>{const t=S.chatDraft.trim();if(t){S.chatDraft="";const i=document.getElementById("chatin");if(i)i.value="";sendChat(t)}},
  toRoulette:()=>{S.roul=S.roul&&S.roul.mid===S.cur?S.roul:{mid:S.cur,pens:[...DEFAULT_PEN],mode:"last",rot:0,spinning:false};go("roulette")},
  mode:()=>{if(S.roul.spinning)return;S.roul.mode=S.roul.mode==="last"?"all":"last";S.roul.rot=0;render(true)},
  penEdit:()=>{if(S.roul.mode!=="last"){toast("꼴찌만 돌리기 모드에서 벌칙을 편집할 수 있어요");return}S.sheet={type:"pen"};render(true)},
  penAdd:()=>{S.roul.pens.push("새 벌칙");render(true)},
  penDel:v=>{S.roul.pens.splice(+v,1);render(true)},
  spin:()=>{const rl=S.roul,R=S.race,m=getMeeting(S.cur);if(rl.spinning)return;
    const items=rl.mode==="last"?rl.pens.filter(x=>x.trim()):m.people.map((p,i)=>nameOf(m,i)),n=items.length,k=Math.floor(Math.random()*n);
    if(n<2){toast("벌칙을 2개 이상 넣어주세요");return}
    const mid=(k+0.5)*360/n,jit=(Math.random()-0.5)*(300/n)*0.8,base=Math.ceil(rl.rot/360)*360;
    rl.rot=base+360*5+(360-mid)+jit;rl.spinning=true;
    const w=document.getElementById("wheel");if(w){void w.getBoundingClientRect();w.style.transform=`rotate(${rl.rot}deg)`}
    document.querySelectorAll("[data-a=spin]").forEach(b=>{b.disabled=true});const cb=document.querySelector(".cta-bar .btn");if(cb)cb.textContent="두구두구...";
    setTimeout(()=>{rl.spinning=false;const order=rankOrder(R,m),loser=order[order.length-1];
      S.verdict=rl.mode==="last"?{idx:loser,name:nameOf(m,loser),pen:items[k],mode:"last"}:{idx:k,name:items[k],pen:"오늘 커피 쏘기",mode:"all"};
      track("roulette");render(true)},4300)},
  shareVerdict:()=>{const v=S.verdict,R=S.race,m=getMeeting(S.cur);postMsg(R,m,`🎯 룰렛 결과: ${v.name}님 → ${v.pen}`,true);S.verdict=null;go("chat")},
  finish:()=>{const v=S.verdict,R=S.race,m=getMeeting(S.cur),order=rankOrder(R,m);
    m.status="done";m.result={order,lateMin:m.people.map((_,i)=>{const a=liveOf(R,i).arr;return a?Math.max(0,Math.round((a-meetStart(m))/6e4)):null}),penalty:v.pen,loser:v.mode==="last"?order[order.length-1]:v.idx};
    if(m.result.lateMin[0]>0)PROFILE.lateAvg=Math.round((PROFILE.lateAvg*2+m.result.lateMin[0])/3);saveProfile();
    stopGps(R);putMeeting(m);S.verdict=null;S.race=null;S.roul=null;toast("기록에 저장했어요");go("records")},
  editName:()=>{S.sheet={type:"name"};render(true)},
  prep:v=>{const [i,dx]=v.split(":").map(Number);PROFILE.prep[i][1]=Math.max(0,Math.min(90,PROFILE.prep[i][1]+dx));saveProfile();render(true)},
  resetFunnel:()=>{store.set("mg3_funnel",{});render(true);toast("지표를 초기화했어요")},
  resetAll:()=>{["mg3_funnel","mg3_meetings","mg3_seeded","mg3_profile"].forEach(k=>{try{localStorage.removeItem(k)}catch(e){}});location.reload()},
  closeSheet:(v,el,e)=>{if(e&&e.target.closest("[data-stop]")&&el.classList.contains("dim"))return;
    if(S.sheet?.type==="name"){const th=S.sheet.then;if(!PROFILE.name.trim()){if(el&&el.classList.contains("dim")){S.sheet=null;render(true);return}toast("이름을 입력해주세요");return}saveProfile();S.sheet=null;if(th){A[th]();return}}S.sheet=null;render(true)},
};
function sendChat(t){const R=S.race,m=getMeeting(S.cur);if(!R||!m)return;postMsg(R,m,t,false);track("chat")}
function copyText(t,msg="복사했어요. 단톡방에 붙여넣어 주세요"){
  const ok=()=>toast(msg);
  const fb=()=>{const ta=document.createElement("textarea");ta.value=t;ta.style.position="fixed";ta.style.opacity="0";document.body.appendChild(ta);ta.select();try{document.execCommand("copy");ok()}catch(e){toast("길게 눌러 직접 복사해주세요")}ta.remove()};
  if(navigator.clipboard?.writeText)navigator.clipboard.writeText(t).then(ok,fb);else fb();
}
document.addEventListener("click",e=>{const el=e.target.closest("[data-a]");if(!el||el.disabled)return;
  if(el.dataset.a==="closeSheet"&&el.classList.contains("dim")&&e.target.closest("[data-stop]"))return;
  A[el.dataset.a]?.(el.dataset.v,el,e)});
document.addEventListener("input",e=>{const t=e.target,k=t.dataset.in;if(!k)return;
  if(k==="mname")S.d.name=t.value;
  if(k==="lq"){S.loc.q=t.value;clearTimeout(lqT);lqT=setTimeout(()=>searchLoc(t.value),KMAP.ready?250:60)}
  if(k==="gname")S.d.people[S.guest.idx].name=t.value;
  if(k==="sq"){S.stationQ=t.value;const l=document.getElementById("slist");if(l)l.innerHTML=stationList(t.value);}
  if(k==="fname"){S.d.people[S.sheet.idx].name=t.value;}
  if(k==="chat")S.chatDraft=t.value;
  if(k==="pen")S.roul.pens[+t.dataset.i]=t.value;
  if(k==="myname"){PROFILE.name=t.value.trim();}
  if(k==="fair"||k==="area")S.w[k]=+t.value;
});
document.addEventListener("change",e=>{const k=e.target.dataset.in;if(k==="fair"||k==="area"){const prev=S.results[S.sel].hub.name;runRecommend();S.sel=0;render(true);
  if(S.results[0].hub.name!==prev)toast(`기준을 바꾸니 ${S.results[0].hub.name}역이 1순위예요`)}
  if(k==="fname"&&S.screen==="s4")render(true)});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&S.sheet){S.sheet=null;render(true)}
  if(e.key==="Enter"&&e.target.id==="chatin"&&!e.isComposing&&e.keyCode!==229){e.preventDefault();A.send()}});
document.addEventListener("visibilitychange",()=>{if(document.visibilityState!=="visible")return;if(window.__livePoll)window.__livePoll();if(window.__raceP)window.__raceP()});
// 시간 휠(시/분): 스크롤이 멈추면 가운데 값 선택
let wheelT;document.addEventListener("scroll",e=>{const id=e.target.id;if((id!=="twH"&&id!=="twM")||!S.d)return;clearTimeout(wheelT);
  wheelT=setTimeout(()=>{if(!S.d||S.screen!=="s3")return;const i=Math.round(e.target.scrollTop/50),H=Math.floor(S.d.time/60),M=S.d.time%60;
    const t=id==="twH"?Math.max(0,Math.min(23,i))*60+M:H*60+Math.max(0,Math.min(59,i));if(t!==S.d.time){S.d.time=t;render(true)}},140)},true);
// 초대 링크: /j/코드 (Vercel rewrite) 또는 #/j/코드
const INVITE_CODE=(location.pathname.match(/^\/j\/([a-z0-9]+)/i)||location.hash.match(/^#\/j\/([a-z0-9]+)/i)||[])[1];
(async()=>{const online=await loadSupabase();
  if(INVITE_CODE&&online){guestBoot(INVITE_CODE);return}
  if(S.screen==="boot")S.screen="home";
  if(INVITE_CODE){S.d=freshDraft();syncFriends(S.d);S.d.name="금요일 저녁 모임";S.guest={idx:1};S.d.people[1].state="opened";S.screen="g_land"}
  render()})();
if(INVITE_CODE&&CONFIG.SUPABASE_URL)S.screen="boot";render();
</script>
</body>
</html>
